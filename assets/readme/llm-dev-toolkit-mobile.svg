<svg xmlns="http://www.w3.org/2000/svg" width="200" height="260" viewBox="0 0 200 260" role="img" aria-labelledby="t d">
  <title id="t">java-backend-skills</title>
  <desc id="d">Claude Code and Codex plugin with 13 skills for Spring Boot + Spring Data JPA on MySQL and PostgreSQL: /code-review, /review-pr, /review-test, /write-test, /optimize-query, /design-solution, plus 7 knowledge skills.</desc>
  <style><![CDATA[
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #1F2937; stroke: #FFFFFF; stroke-opacity: .08; }
    .name { font-size: 14px; font-weight: 700; fill: #F3F4F6; }
    .desc { font-size: 12px; fill: #9CA3AF; }
    .chip { font-size: 9.5px; font-weight: 700; letter-spacing: .5px; }
    .repo { fill: none; stroke: #9CA3AF; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .term { fill: #111827; stroke: #FFFFFF; stroke-opacity: .06; }
    .t { font-size: 11px; }
    .prompt { fill: #B877D9; font-weight: 700; }
    .cmd { fill: #8AB8FF; font-weight: 700; }
    .skill { fill: #FADE2A; font-weight: 700; }
    .ok { fill: #73BF69; font-weight: 700; }
    .line { opacity: 0; animation: line 10s ease-out infinite; }
    @keyframes line { 0% { opacity: 0; transform: translateX(-4px); } 3% { opacity: 1; transform: translateX(0); } 86% { opacity: 1; transform: translateX(0); } 90%, 100% { opacity: 0; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; opacity: 1; } }
  ]]></style>
