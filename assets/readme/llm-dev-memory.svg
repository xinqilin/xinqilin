<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="t d">
  <title id="t">dev-memory</title>
  <desc id="d">Claude Code and Codex CLI plugin: archives sessions into a local SQLite FTS5 database with CJK-aware search, exposes memory_search over MCP, and turns code plus decisions into locally reviewed tech docs opened as a PR.</desc>
  <style><![CDATA[
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #1F2937; stroke: #FFFFFF; stroke-opacity: .08; }
    .name { font-size: 15px; font-weight: 700; fill: #F3F4F6; }
    .desc { font-size: 12px; fill: #9CA3AF; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: .6px; }
    .repo { fill: none; stroke: #9CA3AF; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }

    .node { fill: #111827; stroke: currentColor; stroke-width: 2; }
    .halo { fill: currentColor; opacity: .07; }
    .icon { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon .solid { fill: currentColor; stroke: none; }
    .label { font-size: 12.5px; font-weight: 600; fill: #E5E7EB; text-anchor: middle; }
    .sub { font-size: 10px; fill: #9CA3AF; text-anchor: middle; }
    .wire { stroke: #374151; stroke-width: 2; stroke-dasharray: 3 4; }
    .tag { font-size: 9.5px; fill: #9CA3AF; text-anchor: middle; }
    .bit { fill: #E5E7EB; opacity: 0; }
    .q { font-size: 11px; fill: #9CA3AF; }
    .hit { fill: #73BF69; font-weight: 700; }
    .dim { fill: #6B7280; }
    .result { fill-opacity: 1; }

    .bit { animation: flow 1.8s linear infinite; }
    .dot1, .dot2, .dot3 { transform-box: fill-box; transform-origin: center; animation: hop 1.2s ease-in-out infinite; }
    .dot2 { animation-delay: .15s; } .dot3 { animation-delay: .3s; }
    .result { animation: reveal .8s 1.4s ease-out both; }
    @keyframes flow { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(92px); opacity: 0; } }
    @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-2.5px); } }
    @keyframes reveal { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bit, .dot1, .dot2, .dot3, .result { animation: none; }
    }
  ]]></style>
  
  <rect class="panel" x="0.5" y="0.5" width="419" height="229" rx="10"/>
  <g transform="translate(24 25)"><path class="repo" d="M-6 -7 H5 V7 H-4 A2 2 0 0 1 -6 5 Z M-6 5 A2 2 0 0 1 -4 3 H5"/></g>
  <text class="name" x="38" y="30">dev-memory</text>
  <g transform="translate(312 15)">
    <rect width="92" height="20" rx="10" fill="#B877D9" fill-opacity=".12" stroke="#B877D9" stroke-opacity=".45"/>
    <text class="chip mono" x="46.0" y="14" fill="#B877D9" text-anchor="middle">PLUGIN · MCP</text>
  </g>
  <text class="desc" x="16" y="56">Local memory for Claude Code &amp; Codex CLI sessions —</text>
  <text class="desc" x="16" y="72">searchable over MCP, turned into reviewed tech docs.</text>
  <line class="wire" x1="94" y1="118" x2="186" y2="118"/><text class="tag mono" x="140.0" y="109">Stop hook</text><g transform="translate(94 118)"><circle class="bit" r="2.4" style="animation-delay:0.0s"/></g><g transform="translate(94 118)"><circle class="bit" r="2.4" style="animation-delay:-0.6s"/></g><g transform="translate(94 118)"><circle class="bit" r="2.4" style="animation-delay:-1.2s"/></g><line class="wire" x1="234" y1="118" x2="326" y2="118"/><text class="tag mono" x="280.0" y="109">MCP search</text><g transform="translate(234 118)"><circle class="bit" r="2.4" style="animation-delay:0.0s"/></g><g transform="translate(234 118)"><circle class="bit" r="2.4" style="animation-delay:-0.6s"/></g><g transform="translate(234 118)"><circle class="bit" r="2.4" style="animation-delay:-1.2s"/></g>
  
  <g transform="translate(70 118)" style="color:#B877D9">
    <circle class="halo" r="29"/><circle class="node" r="22"/><g class="icon"><path d="M-10 -8 H8 A3 3 0 0 1 11 -5 V3 A3 3 0 0 1 8 6 H-2 L-7 10 V6 H-10 A3 3 0 0 1 -13 3 V-5 A3 3 0 0 1 -10 -8 Z" transform="translate(1 -1)"/><circle class="solid dot1" cx="-5" cy="0" r="1.6"/><circle class="solid dot2" cx="0" cy="0" r="1.6"/><circle class="solid dot3" cx="5" cy="0" r="1.6"/></g>
  </g>
  <text class="label" x="70" y="160">sessions</text>
  <text class="sub mono" x="70" y="176">Claude Code · Codex</text>
  <g transform="translate(210 118)" style="color:#5794F2">
    <circle class="halo" r="29"/><circle class="node" r="22"/><g class="icon"><ellipse cx="0" cy="-7" rx="9" ry="3.5"/><path d="M-9 -7 V7 A9 3.5 0 0 0 9 7 V-7 M-9 0 A9 3.5 0 0 0 9 0"/></g>
  </g>
  <text class="label" x="210" y="160">memory.db</text>
  <text class="sub mono" x="210" y="176">SQLite FTS5 · CJK</text>
  <g transform="translate(350 118)" style="color:#73BF69">
    <circle class="halo" r="29"/><circle class="node" r="22"/><g class="icon"><path d="M-7 -10 H3 L8 -5 V10 H-7 Z M3 -10 V-5 H8"/><path d="M-3.5 2.5 L-1 5 L4 -0.5"/></g>
  </g>
  <text class="label" x="350" y="160">docs → PR</text>
  <text class="sub mono" x="350" y="176">reviewed locally</text>
  <text class="q mono" x="16" y="210">memory_search("例外")<tspan class="result"><tspan class="hit" dx="8">→ 12/12 hits</tspan><tspan class="dim" dx="8">default: 3/12</tspan></tspan></text>
</svg>
