    @keyframes line {
      0% { opacity: 0; transform: translateX(-4px); }
      3% { opacity: 1; transform: translateX(0); }
      86% { opacity: 1; transform: translateX(0); }
      90%, 100% { opacity: 0; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; opacity: 1; } }
  ]]></style>

