<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="t d">
  <title id="t">java-backend-skills</title>
  <desc id="d">Claude Code and Codex plugin with 13 skills for Spring Boot + Spring Data JPA on MySQL and PostgreSQL: /java-backend:code-review, review-pr, review-test, write-test, optimize-query and design-solution, plus 7 knowledge skills such as transactions-consistency, jpa-hibernate and sql-performance.</desc>
