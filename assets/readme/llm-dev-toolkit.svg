<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="t d">
  <title id="t">claude-dev-toolkit-marketplace</title>
  <desc id="d">Claude Code plugin marketplace with 4 plugins for Java and Spring Boot teams: /code-review, /review-pr, /review-test, /design-solution and /optimize-query, plus effective-java, mysql-optimization and clean-architecture skills.</desc>
  <style><![CDATA[
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #1F2937; stroke: #FFFFFF; stroke-opacity: .08; }
    .name { font-size: 15px; font-weight: 700; fill: #F3F4F6; }
    .desc { font-size: 12px; fill: #9CA3AF; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: .6px; }
    .repo { fill: none; stroke: #9CA3AF; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }

    .term { fill: #111827; stroke: #FFFFFF; stroke-opacity: .06; }
    .t { font-size: 10.5px; }
    .prompt { fill: #B877D9; font-weight: 700; }
    .cmd { fill: #8AB8FF; font-weight: 700; }
    .plugin { fill: #9CA3AF; }
    .skill { fill: #FADE2A; font-weight: 700; }
    .ok { fill: #73BF69; font-weight: 700; }
    .line { opacity: 0; }
    .line { animation: line 10s ease-out infinite; }
    @keyframes line {
      0% { opacity: 0; transform: translateX(-4px); }
      3% { opacity: 1; transform: translateX(0); }
      86% { opacity: 1; transform: translateX(0); }
      90%, 100% { opacity: 0; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; opacity: 1; } }
  ]]></style>
  
  <rect class="panel" x="0.5" y="0.5" width="419" height="229" rx="10"/>
  <g transform="translate(24 25)"><path class="repo" d="M-6 -7 H5 V7 H-4 A2 2 0 0 1 -6 5 Z M-6 5 A2 2 0 0 1 -4 3 H5"/></g>
  <text class="name" x="38" y="30">claude-dev-toolkit-marketplace</text>
  <g transform="translate(328 15)">
    <rect width="76" height="20" rx="10" fill="#5794F2" fill-opacity=".12" stroke="#5794F2" stroke-opacity=".45"/>
    <text class="chip mono" x="38.0" y="14" fill="#5794F2" text-anchor="middle">4 PLUGINS</text>
  </g>
  <text class="desc" x="16" y="56">Claude Code plugin marketplace for Java / Spring Boot —</text>
  <text class="desc" x="16" y="72">code &amp; PR review, test review, design, SQL tuning.</text>
  <rect class="term" x="16" y="86" width="388" height="130" rx="8"/>
  
  <g class="line" style="animation-delay:0.35s">
    <text class="t mono" x="28" y="108.0"><tspan class="prompt">›</tspan> <tspan class="cmd">/code-review</tspan></text>
    <text class="t mono plugin" x="160" y="108.0">bill-code-reviewer</text>
    <text class="t mono ok" x="392" y="108.0" text-anchor="end">✓</text>
  </g>
  <g class="line" style="animation-delay:0.85s">
    <text class="t mono" x="28" y="127.5"><tspan class="prompt">›</tspan> <tspan class="cmd">/review-pr</tspan></text>
    <text class="t mono plugin" x="160" y="127.5">bill-code-reviewer</text>
    <text class="t mono ok" x="392" y="127.5" text-anchor="end">✓</text>
  </g>
  <g class="line" style="animation-delay:1.35s">
    <text class="t mono" x="28" y="147.0"><tspan class="prompt">›</tspan> <tspan class="cmd">/review-test</tspan></text>
    <text class="t mono plugin" x="160" y="147.0">bill-billing-unit-test-reviewer</text>
    <text class="t mono ok" x="392" y="147.0" text-anchor="end">✓</text>
  </g>
  <g class="line" style="animation-delay:1.85s">
    <text class="t mono" x="28" y="166.5"><tspan class="prompt">›</tspan> <tspan class="cmd">/design-solution</tspan></text>
    <text class="t mono plugin" x="160" y="166.5">bill-java-developer</text>
    <text class="t mono ok" x="392" y="166.5" text-anchor="end">✓</text>
  </g>
  <g class="line" style="animation-delay:2.35s">
    <text class="t mono" x="28" y="186.0"><tspan class="prompt">›</tspan> <tspan class="cmd">/optimize-query</tspan></text>
    <text class="t mono plugin" x="160" y="186.0">bill-java-developer</text>
    <text class="t mono ok" x="392" y="186.0" text-anchor="end">✓</text>
  </g>
  <g class="line" style="animation-delay:2.85s">
    <text class="t mono" x="28" y="205.5"><tspan class="prompt">+</tspan> <tspan class="skill">skills</tspan><tspan class="plugin"> effective-java · mysql-optimization · clean-arch</tspan></text>
  </g>
</svg>
