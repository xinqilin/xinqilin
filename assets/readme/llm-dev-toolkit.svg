    .desc { font-size: 12px; fill: #9CA3AF; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: .6px; }
    .repo { fill: none; stroke: #9CA3AF; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }

    .term { fill: #111827; stroke: #FFFFFF; stroke-opacity: .06; }
