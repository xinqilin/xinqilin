    .prompt { fill: #B877D9; font-weight: 700; }
    .cmd { fill: #8AB8FF; font-weight: 700; }
    .plugin { fill: #9CA3AF; }
    .skill { fill: #FADE2A; font-weight: 700; }
    .ok { fill: #73BF69; font-weight: 700; }
    .line { opacity: 0; }
