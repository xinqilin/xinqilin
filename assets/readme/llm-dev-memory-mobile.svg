<svg xmlns="http://www.w3.org/2000/svg" width="200" height="260" viewBox="0 0 200 260" role="img" aria-labelledby="t d">
  <title id="t">dev-memory</title>
  <desc id="d">Claude Code and Codex CLI plugin: session memory in local SQLite FTS5 with CJK-aware search, MCP memory_search, reviewed tech docs as a PR.</desc>
  <style><![CDATA[
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #1F2937; stroke: #FFFFFF; stroke-opacity: .08; }
    .name { font-size: 14px; font-weight: 700; fill: #F3F4F6; }
    .desc { font-size: 12px; fill: #9CA3AF; }
    .chip { font-size: 9.5px; font-weight: 700; letter-spacing: .5px; }
    .repo { fill: none; stroke: #9CA3AF; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .node { fill: #111827; stroke: currentColor; stroke-width: 2; }
    .halo { fill: currentColor; opacity: .07; }
    .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon .solid { fill: currentColor; stroke: none; }
    .lbl { font-size: 10.5px; fill: #9CA3AF; text-anchor: middle; }
    .wire { stroke: #374151; stroke-width: 2; stroke-dasharray: 3 4; }
    .bit { fill: #E5E7EB; opacity: 0; }
    .q { font-size: 11.5px; fill: #9CA3AF; }
    .hit { fill: #73BF69; font-weight: 700; }
    .dim { font-size: 10.5px; fill: #6B7280; }
    .bit { animation: flow 1.6s linear infinite; }
    @keyframes flow { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(28px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bit { animation: none; } }
  ]]></style>
